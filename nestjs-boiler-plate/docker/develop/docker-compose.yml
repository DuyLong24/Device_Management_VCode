version: '3'

services:
  # Main API Service
  api_wms_alvar_quytb_com:
    container_name: api_wms_alvar_quytb_com
    build:
      context: ./
      dockerfile: ./Dockerfile
    restart: always
    networks:
      - traefik_traefik
    working_dir: /usr/src/app
    volumes:
      - '/containers/data/api_wms_alvar_quytb_com:/usr/src/app/uploads' # Adjust volume mapping if needed
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    labels:
      - 'traefik.enable=true'
      # HTTP Router
      - 'traefik.http.routers.api_wms_alvar_quytb_com.entrypoints=http'
      - 'traefik.http.routers.api_wms_alvar_quytb_com.rule=Host(`api.wms.alvar.quytb.com`)'
      # Middleware: Redirect HTTP to HTTPS
      - 'traefik.http.middlewares.https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.api_wms_alvar_quytb_com.middlewares=https-redirect'
      # HTTPS Router
      - 'traefik.http.routers.api_wms_alvar_quytb_com-secure.entrypoints=https'
      - 'traefik.http.routers.api_wms_alvar_quytb_com-secure.rule=Host(`api.wms.alvar.quytb.com`)'
      - 'traefik.http.routers.api_wms_alvar_quytb_com-secure.tls=true'
      - 'traefik.http.routers.api_wms_alvar_quytb_com-secure.tls.certresolver=http'
      - 'traefik.http.routers.api_wms_alvar_quytb_com-secure.service=api_wms_alvar_quytb_com'
      # Service Port
      - 'traefik.http.services.api_wms_alvar_quytb_com.loadbalancer.server.port=3000'
      - 'traefik.docker.network=traefik_traefik'

networks:
  traefik_traefik:
    external: true